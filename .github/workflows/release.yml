name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set version in module.json
        run: |
          node -e "const fs=require('fs');const p='module.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='${{ steps.version.outputs.version }}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"

      - name: Build module.zip
        run: |
          zip -r module.zip \
            module.json \
            README.md \
            CHANGELOG.md \
            LICENSE \
            scripts \
            styles \
            templates \
            lang \
            -x "*.DS_Store"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" module.json module.zip \
            --title "Release ${{ steps.version.outputs.version }}" \
            --generate-notes
